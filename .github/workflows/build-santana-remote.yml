name: Compilar Santana Remote v0.2.0
on:
  push:
    branches:
      - build/santana-remote-v0.1.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  santana-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descompactar fonte Santana Remote 0.2.0
        run: |
          python3 -m pip install --break-system-packages brotli
          mkdir -p SantanaRemote
          cat SantanaRemote_full_v020.part* | base64 -d > SantanaRemote_full_v020.tar.br
          python3 -c 'import brotli; open("SantanaRemote_full_v020.tar","wb").write(brotli.decompress(open("SantanaRemote_full_v020.tar.br","rb").read()))'
          tar -xf SantanaRemote_full_v020.tar -C SantanaRemote
      - name: Compilar APK debug
        working-directory: SantanaRemote
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SantanaRemote-v0.2.0-completo-voz-apk
          path: SantanaRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
