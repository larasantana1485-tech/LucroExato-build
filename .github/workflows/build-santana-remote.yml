name: Compilar Santana Remote APK
on:
  push:
    branches:
      - build/santana-remote-v0.1.0
  workflow_dispatch:
permissions:
  contents: read
jobs:
  santana-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Preparar SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Descompactar Santana Remote
        run: |
          python3 -m pip install --break-system-packages brotli
          mkdir -p SantanaRemote
          base64 -d SantanaRemote_source.tar.br.b64 > SantanaRemote_source.tar.br
          python3 -c 'import brotli; open("SantanaRemote_source.tar","wb").write(brotli.decompress(open("SantanaRemote_source.tar.br","rb").read()))'
          tar -xf SantanaRemote_source.tar -C SantanaRemote
      - name: Compilar APK debug
        working-directory: SantanaRemote
        run: gradle --no-daemon :app:assembleDebug
      - name: Enviar APK gerado
        uses: actions/upload-artifact@v4
        with:
          name: SantanaRemote-v0.1.0-debug-apk
          path: SantanaRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
