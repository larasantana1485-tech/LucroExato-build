name: Compilar Santana Remote v0.2.5 — filtro de voz
on:
  push:
    branches:
      - build/santana-remote-v0.2.5-voz-filtrada
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  santana-remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar projeto base e aplicar versoes anteriores
        run: |
          python3 -m pip install --break-system-packages brotli
          mkdir -p SantanaRemote
          cat SantanaRemote_source.part00 SantanaRemote_source.part01 SantanaRemote_source.part02 SantanaRemote_source.part03 | base64 -d > SantanaRemote_source.tar.br
          python3 -c 'import brotli; open("SantanaRemote_source.tar","wb").write(brotli.decompress(open("SantanaRemote_source.tar.br","rb").read()))'
          tar -xf SantanaRemote_source.tar -C SantanaRemote
          sed -i 's/fun setAutoKeyboard(/fun updateAutoKeyboard(/g' SantanaRemote/app/src/main/java/br/com/santana/remote/TvController.kt
          sed -i 's/tv::setAutoKeyboard/tv::updateAutoKeyboard/g' SantanaRemote/app/src/main/java/br/com/santana/remote/MainActivity.kt
          python3 SantanaRemote_youtube_fix.py
      - name: Aplicar controle completo, voz e icone v0.2.0
        run: |
          cat SantanaRemote_full_v020.part* | base64 -d > SantanaRemote_patch_v020.tar.br
          python3 -c 'import brotli; open("SantanaRemote_patch_v020.tar","wb").write(brotli.decompress(open("SantanaRemote_patch_v020.tar.br","rb").read()))'
          tar -xf SantanaRemote_patch_v020.tar
          python3 apply_v020.py
          grep -q 'versionName = "0.2.0-completo-voz"' SantanaRemote/app/build.gradle.kts
      - name: Restaurar tela única e touchpad v0.2.1
        run: |
          base64 -d SantanaRemote_single_screen_v021.b64 | gzip -d | python3 -
          grep -q 'versionName = "0.2.1-tela-unica"' SantanaRemote/app/build.gradle.kts
      - name: Ajustar opt-in Material 3 para meia-aba
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("SantanaRemote/app/src/main/java/br/com/santana/remote/MainActivity.kt")
          s = p.read_text()
          old = '@Composable\nprivate fun RemoteApp()'
          assert old in s, "Não foi possível localizar RemoteApp"
          p.write_text(s.replace(old, '@OptIn(ExperimentalMaterial3Api::class)\n' + old, 1))
          PY
      - name: Integrar voz natural e testes
        run: |
          cp VoiceCommandParser_v022.kt SantanaRemote/app/src/main/java/br/com/santana/remote/VoiceCommandParser.kt
          mkdir -p SantanaRemote/app/src/test/java/br/com/santana/remote
          cp VoiceCommandParserTest_v022.kt SantanaRemote/app/src/test/java/br/com/santana/remote/VoiceCommandParserTest.kt
          python3 voice_v022.py
          grep -q 'versionName = "0.2.2-voz-natural"' SantanaRemote/app/build.gradle.kts
      - name: Aplicar atualização v0.2.3 (layout clássico e botões LG)
        run: |
          python3 - <<'PY'
          import brotli, base64, hashlib
          from pathlib import Path
          data = base64.b64decode(Path("SantanaRemote_v023_diff.b64").read_text())
          assert len(data) == 7088, f"Unexpected patch bytes: {len(data)}"
          assert hashlib.sha256(data).hexdigest() == "a62392f775118dfe7e822e4be9ac393b86799de3b2cadaa1b41d2b9ca6a89f5b"
          patch_text = brotli.decompress(data).decode("utf-8")
          old_prompt = "Ex.: canal cinco, volume cinco vezes, buscar receitas no YouTube"
          branch_prompt = "Ex.: canal cinco, aumentar volume cinco vezes, buscar receitas no YouTube"
          assert patch_text.count(old_prompt) == 1, "Unexpected diff context"
          Path("SantanaRemote_v023.patch").write_text(patch_text.replace(old_prompt, branch_prompt), encoding="utf-8")
          PY
          patch --dry-run -p1 < SantanaRemote_v023.patch
          patch -p1 < SantanaRemote_v023.patch
          grep -q 'versionName = "0.2.3-controle-original"' SantanaRemote/app/build.gradle.kts
      - name: Aplicar v0.2.4 — ativação Ei Santana
        run: |
          python3 - <<'PY'
          import brotli, base64, hashlib
          from pathlib import Path
          data = base64.b64decode(Path("SantanaRemote_v024_code_patch.b64").read_text())
          assert len(data) == 5671, f"Unexpected patch size: {len(data)}"
          assert hashlib.sha256(data).hexdigest() == "e053fd8d6c6b27553a568dd68a9b80f323ffc74ec9933fb0910788428c5d919e"
          Path("SantanaRemote_v024.patch").write_bytes(brotli.decompress(data))
          PY
          (cd SantanaRemote && patch --dry-run -p1 < ../SantanaRemote_v024.patch)
          (cd SantanaRemote && patch -p1 < ../SantanaRemote_v024.patch)
          grep -q 'versionName = "0.2.4-ei-santana"' SantanaRemote/app/build.gradle.kts
      - name: Aplicar filtro de conversa ambiente v0.2.5
        run: |
          python3 - <<'PY'
          import base64, brotli, hashlib
          from pathlib import Path
          data = base64.b64decode(Path('SantanaRemote_v025_patch.b64').read_text())
          assert len(data) == 3074
          assert hashlib.sha256(data).hexdigest() == '321aa9f8d160fd2fd55e1e7e7aeb1fbaa0a6ae0338e33033383d9e1b2d34ffe7'
          patch = brotli.decompress(data).decode('utf8')
          patch = patch.split('--- a/README.md')[0]
          Path('SantanaRemote_v025.patch').write_text(patch, encoding='utf8')
          PY
          (cd SantanaRemote && patch --dry-run -p1 < ../SantanaRemote_v025.patch)
          (cd SantanaRemote && patch -p1 < ../SantanaRemote_v025.patch)
          grep -q 'versionName = "0.2.5-ei-santana-voz-filtrada"' SantanaRemote/app/build.gradle.kts
      - name: Testar frases de voz
        working-directory: SantanaRemote
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compilar APK debug
        working-directory: SantanaRemote
        run: gradle --no-daemon :app:assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SantanaRemote-v0.2.5-Voz-Filtrada-debug-apk
          path: SantanaRemote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publicar download direto no GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp SantanaRemote/app/build/outputs/apk/debug/app-debug.apk SantanaRemote-0.2.5-Voz-Filtrada.apk
          if gh release view santana-remote-v0.2.5 >/dev/null 2>&1; then
            gh release upload santana-remote-v0.2.5 SantanaRemote-0.2.5-Voz-Filtrada.apk --clobber
          else
            gh release create santana-remote-v0.2.5 SantanaRemote-0.2.5-Voz-Filtrada.apk \
              --target "$GITHUB_SHA" \
              --title "Santana Remote 0.2.5 — Voz Filtrada" \
              --notes "APK Android v0.2.5: filtra comandos após Ei Santana para ignorar conversa ambiente. Pesquisa YouTube continua experimental." \
              --latest=false
          fi
